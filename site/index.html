<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OnlineOTP - SeuthD3</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "jsqr": "./modules/jsqr/index.js",
          "papaparse": "./modules/papaparse/index.js",
          "otplib": "./modules/otplib/index.js",
          "@otplib/core": "./modules/@otplib/core/index.js",
          "@otplib/hotp": "./modules/@otplib/hotp/index.js",
          "@otplib/totp": "./modules/@otplib/totp/index.js",
          "@otplib/uri": "./modules/@otplib/uri/index.js",
          "@otplib/plugin-base32-scure": "./modules/@otplib/plugin-base32-scure/index.js",
          "@otplib/plugin-crypto-noble": "./modules/@otplib/plugin-crypto-noble/index.js",
          "@scure/base": "./modules/@scure/base/index.js",
          "@noble/hashes/": "./modules/@noble/hashes/",
          "hash-wasm": "./modules/hash-wasm/index.js",
          "argon2": "./modules/argon2/index.js"
        }
      }
    </script>
  </head>
  <body>
    <dialog id="newDialog" popover>
      <button id="newManual">Manual</button>
      <button id="newFromQR">From QR Code</button>
      <button id="newFromURI">From URI</button>
      <button id="newFromFile">From File</button>
    </dialog>
    <nav id="topBar">
      <button id="newButton" popovertarget="newDialog">
        <svg width="18px" height="18px" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="currentColor" stroke-width="4" />
          <line x1="12" y1="24" x2="36" y2="24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <line x1="24" y1="12" x2="24" y2="36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <a>New</a>
      </button>
    </nav>
    <span id="entries">
    </span>
    <script type="module" src="js/main.mjs"></script>
  </body>
</html>
